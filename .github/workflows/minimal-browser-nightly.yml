name: Minimal browser nightly (Linux)

on:
  schedule:
    - cron: '15 18 * * *' # 03:15 JST; GitHub schedule uses UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimal-browser-nightly
  cancel-in-progress: false

jobs:
  linux-nightly:
    # A Chromium build needs substantially more disk/RAM than standard hosted runners.
    runs-on: [self-hosted, linux, x64, brave-nightly]
    timeout-minutes: 720
    env:
      CORE: ${{ github.workspace }}/src/brave
      # Fixed location lets an isolated dedicated runner reuse Chromium downloads.
      # Do NOT use this runner for untrusted pull requests.
    steps:
      - name: Check prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for command in git node pnpm python3 gn autoninja; do
            command -v "$command" >/dev/null || { echo "Missing: $command"; exit 1; }
          done
          df -h .
          free -h

      - name: Checkout Brave Core into Chromium layout
        uses: actions/checkout@v4
        with:
          path: src/brave
          persist-credentials: false

      - name: Initialize Chromium checkout
        shell: bash
        working-directory: ${{ env.CORE }}
        run: |
          set -euo pipefail
          pnpm run init

      - name: Validate minimal preset
        shell: bash
        working-directory: ${{ env.CORE }}
        run: python3 minimal-browser/test_preset.py

      - name: Generate minimal GN build
        shell: bash
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          mkdir -p out/Minimal
          cp brave/minimal-browser/args.gn out/Minimal/args.gn
          gn gen out/Minimal

      - name: Build browser
        shell: bash
        working-directory: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          autoninja -C out/Minimal brave 2>&1 | tee "${{ github.workspace }}/nightly-build.log"

      - name: Capture build details
        if: always()
        shell: bash
        run: |
          {
            echo "Run: ${{ github.run_id }}"
            echo "Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Brave Core ref: ${{ github.sha }}"
            echo "Chromium: $(git -C src rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "Status: ${{ job.status }}"
          } > nightly-manifest.txt

      - name: Upload logs (not an unverified browser release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-browser-nightly-logs-${{ github.run_id }}
          path: |
            nightly-build.log
            nightly-manifest.txt
          if-no-files-found: warn
          retention-days: 14
